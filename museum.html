<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>红军长征数字展馆</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/museum.css">
</head>
<body>

  <!-- 顶部导航 -->
  <nav class="top-nav" id="top-nav">
    <a href="#top" class="logo">红色守望</a>
    <div class="nav-links" id="hall-nav"></div>
  </nav>

  <!-- 加载提示 -->
  <div id="museum-loading" class="loading">展览加载中</div>

  <!-- Hero 区域 -->
  <header class="hero-section" id="top">
    <h1>红军长征星火路线</h1>
    <p class="subtitle">1934–1936年 · 多路红军星火铺开 · 突破围追堵截 · 最终大会师</p>
    <div class="metrics-row" id="metrics-row"></div>
    <div class="curatorial-lanes" id="curatorial-lanes"></div>
  </header>

  <!-- 长征路线全景展板 -->
  <section class="hall-section map-section" id="route">
    <div class="section-header">
      <div class="eyebrow">第一展厅</div>
      <h2>长征路线全景展板</h2>
      <p>在地图上追踪多路红军的行进路线，点击节点查看事件详情</p>
    </div>
    <div class="map-container">
      <div id="map"></div>
    </div>
    <div class="map-legend" id="map-legend"></div>
    <div class="map-controls">
      <button class="btn" id="btn-play" onclick="toggleAnimation()">播放路线动画</button>
      <button class="btn" id="btn-reset" onclick="resetMap()">重置视图</button>
      <div class="speed-group">
        <label for="speed-select">播放速度</label>
        <select id="speed-select" onchange="setSpeed(this.value)">
          <option value="800">0.5x</option>
          <option value="500" selected>1x</option>
          <option value="250">2x</option>
          <option value="125">4x</option>
        </select>
      </div>
    </div>
    <div class="timeline-bar" id="timeline-bar" style="display:none">
      <div class="timeline-progress" id="timeline-progress"></div>
      <div class="timeline-label" id="timeline-label"></div>
    </div>
  </section>

  <!-- 人物生命时间线 -->
  <section class="hall-section" id="persons">
    <div class="section-header">
      <div class="eyebrow">第二展厅</div>
      <h2>人物生命时间线</h2>
      <p>从领袖到普通战士，每个人物都有自己的抉择与坚持</p>
    </div>
    <div class="person-filters" id="person-filters"></div>
    <div class="person-list" id="person-list"></div>
  </section>

  <!-- 资料档案 -->
  <section class="hall-section" id="archive">
    <div class="section-header">
      <div class="eyebrow">第三展厅</div>
      <h2>资料档案</h2>
      <p>让纪念不止于叙述，也经得起回看与考证</p>
    </div>
    <div style="max-width: var(--max-width); margin: 0 auto;">
      <div class="catalog-tabs" id="catalog-tabs"></div>
      <div class="catalog-search">
        <input type="text" id="catalog-search" placeholder="搜索人物、地点、事件、部队...">
      </div>
      <div class="catalog-stats" id="catalog-stats"></div>
      <div class="catalog-grid" id="catalog-grid"></div>
    </div>
  </section>

  <!-- 底部：前往问卷 -->
  <footer class="footer-section hall-section" id="memorial">
    <div class="section-header">
      <div class="eyebrow">纪念与学习</div>
      <h2>检验你的学习成果</h2>
      <p>根据你在展馆中浏览的内容，系统将为你生成问卷</p>
    </div>
    <a href="questionnaire.html" class="btn-quiz">进入问卷测验</a>
    <p class="footer-text">数据来源：中国共产党新闻网、新华网、共产党员网等权威党史资料</p>
  </footer>

  <!-- 人物详情弹窗 -->
  <div id="person-modal" class="modal-overlay hidden" onclick="closeModal(event)">
    <div class="modal-content" id="modal-content" onclick="event.stopPropagation()"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/museum.js"></script>
</body>
</html>
